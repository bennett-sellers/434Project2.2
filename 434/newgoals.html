<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype - Home</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>

  <body onload = "loadGoal()">
    <div class="device">
      <!-- Home Content with Progress Rings -->
      <div id="Home" class="tabcontent" style="display: block;">
        <h1>WealthFit</h1>
        <div id = "goalsKeyboard">
          <img src = "assets\keyboard.jpeg" alt = "keyboard" width = 550px height = 300px>
        </div>
        <div>
          <h2 id = "goallabel">Goal: Save $1000 by 01/01/2026</h2>
          <p class = "proglabel" style="text-align: left;">This Week's Progress:</p>
        </div>
        
  

        <div class="bars" >
          <div class="bar"><div class="bar-fill" id="weeklybar" style="background:#e6c11e"></div></div>
        </div>
        <div>
          <p class = "proglabel" id = "goalproglabel">You saved $75 this week! Save $100 to stay on track to reach your goal of $1000!</p>
        </div>
      <div class="goal-flexbox">
        <div class="goal-form">
          <h2>Update Goal</h2>
          <label for="goalAmount">Target Amount ($):</label>
          <input type="number" id="goalAmount" min="1" placeholder="$" onclick="showGoalsKeyboard()"/>
          <br>

          <label for="goalDate">Target Date:</label>
          <input type="date" id="goalDate" onclick="showGoalsKeyboard()"/>
          <br>
          <button id="saveGoalBtn" onclick="updateGoal()">Save Goal</button>
        </div>
      </div>
        

      </div>

      <!-- Bottom Navigation -->
      <button class="tablink" style="background-color: grey;">
        <img src="assets/goal.png" class="icon" alt="goals"/>
        <br />Goals
      </button>
      <button class="tablink" onclick="window.location.href='log.html'">
        <img src="assets/edit.png" class="icon" alt="log"/>
        <br />Log
      </button>
      <button class="tablink" onclick="window.location.href='stats.html'">
        <img src="assets/stat.png" class="icon" alt="stats" />
        <br />Stats
      </button>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
