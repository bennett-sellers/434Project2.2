<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype - Log 2.0</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>
<body>
    <div class="device">
      <!-- Log/Expenses Content -->
      <div id="Log" class="tabcontent" style="display: block;">
        <h1 id="log-header">Transaction Log</h1>

        <div id="new-transaction-container" >
          <h1 id="new-transaction-header">Add Transaction</h1>
          <button id="spent-btn" class="btn" onclick="toggleExpenseType('spent')">Spent</button>
          <button id="gained-btn" class="btn" onclick="toggleExpenseType('gained')">Gained</button>
          <input type="number" id="amount-input" placeholder="Amount" />
          <input type="text" id="title-input" placeholder="Title" />
          <input type="date" id="date-input" placeholder="Date">
          <input type="time" id="time-input" placeholder="Time">
          <button id="enter-btn" class="btn" onclick="enterExpense()">Enter</button> 
        </div>

        <div id="quick-add-container" >
            <button id="quick-add-btn" class="btn" onclick="">Quick Add </button>
            <button id="manage-quick-add-btn" class="btn" onclick="toggleDisplay('manage-quick-add-container', 'block')">Manage Quick Add</button>
        </div>

        <div id="manage-quick-add-container" class="manage-overlay" style="display: none;">
          <div>
            <button class="btn" onclick="toggleDisplay('manage-quick-add-container', 'none')">Back</button>

            <button class="btn" onclick="">Add new</button>

              <div id="test" class="expense-entry">

                <div id="entry" class="expense-entry">
                  <div style="text-align: left; color: black;">
                    <div style="display: inline-block;">test</div>
                    <div style="display: inline-block;">test</div>
                    <div style="display: inline-block;">test</div>
                    <div style="display: inline-block;">test</div>
                  </div>
                  <h2 id="entry-title">Title</h2>
                  <div><span>Spent</span><span>$</span></div>

                  <button id="edit-btn" class="btn" onclick="editQuickAddEntry()">Edit</button>
                  <button id="delete-btn" class="btn" onclick="deleteQuickAddEntry()">Delete</button>
                </div>




              </div>
            </div>
          </div>
        
          <div id="recurringList" class="recurring-list">
            <!-- Recurring transactions will be rendered here -->
          </div>
        
          <div id="recurringEmpty" class="empty-state" style="display: none;">
            No recurring transactions yet.
          </div>
      </div>
    </div>
      <!-- Bottom Navigation -->
      <button class="tablink" onclick="window.location.href='goals.html'">
          <img src="assets/text_icon.png" class="icon" alt="goals"/>
          <br />Goals
      </button>
      <button class="tablink" style="background-color: orange;">
          <img src="assets/lower_right_icon.png" class="icon" alt="log"/>
          <br />Log
      </button>
      <button class="tablink" onclick="window.location.href='index.html'">
          <img src="assets/colors_icon.png" class="icon" alt="home" />
          <br />Home
      </button>
      <button class="tablink" onclick="window.location.href='stats.html'">
          <img src="assets/user.png" class="icon" alt="stats" />
          <br />Stats
      </button>
      <button class="tablink" onclick="window.location.href='settings.html'">
          <img src="assets/choices_icon.png" class="icon" alt="settings"/>
          <br />Settings
      </button>
    </div>
    <script src="js/main.js"></script>
  </body>
</html>
