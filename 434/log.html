<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WealthFit - Transaction Log</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>


  <body>
    <div class="device">
      <!-- Log/Expenses Content -->
      <div id="Log" class="logcontent" style="display: block;">
        <h1 id="log-header">Transaction Log</h1>

        <!-- Add Transaction Form -->
        <div id="new-transaction-container">
          <h2 id="new-transaction-header">Add Transaction</h2>
          <div style="margin-bottom: 15px;">
            <button id="spent-btn" class="btn" onclick="toggleExpenseType('spent')">Spent</button>
            <button id="gained-btn" class="btn" onclick="toggleExpenseType('gained')">Gained</button>
          </div>
          <input type="number" id="amount-input" placeholder="Amount" />
          <input type="text" id="title-input" placeholder="Title" />
          <input type="date" id="date-input" placeholder="Date">
          <input type="time" id="time-input" placeholder="Time">
          <button id="enter-btn" class="btn" onclick="enterExpense()">Enter</button> 
        </div>

        <div id="quick-add-btns-container" >
            <button id="quick-add-btn" class="btn" onclick="toggleDisplay('quick-add-container', 'block')">Quick Add </button>
            <button id="manage-quick-add-btn" class="btn" onclick="toggleDisplay('manage-quick-add-container', 'block')">Manage Quick Add</button>
        </div>

        <div id="quick-add-container" class="manage-overlay" style="display: none;">
          <div>
            <button class="btn" onclick="toggleDisplay('quick-add-container', 'none')" style="margin-left: 15px;">Back</button>
            <button class="btn new-quick-entry-btn" onclick="toggleDisplay('create-new-quick-add-overlay', 'block')">+</button>

              <div id="quick-add-entries" class="expense-entry">

                </div>
                <div  style="background-color: white; height: 2px; margin: 0px 20px;"></div> -->
                <!-- Sample Ends here -->
              </div>
          </div>
        </div>

        <div id="quick-add-container" class="manage-overlay" style="display: none;">
          <div>
            <button class="btn" onclick="toggleDisplay('quick-add-container', 'none')" style="margin-left: 15px;">Back</button>
            <button class="btn new-quick-entry-btn" onclick="toggleDisplay('create-new-quick-add-overlay', 'block')">+</button>

              <div id="quick-add-entries" class="expense-entry">

        <!-- Manage Quick Add Overlay -->
        <div id="manage-quick-add-container" class="manage-overlay" style="display: none;">
          <div>
            <button class="btn" onclick="toggleDisplay('manage-quick-add-container', 'none')" style="margin-left: 15px;">Back</button>
            <button class="btn new-quick-entry-btn" onclick="toggleDisplay('create-new-quick-add-overlay', 'block')">+</button>

              <div id="manage-quick-add-entries" class="expense-entry">

                <!-- Sample Starts here -->

                <!-- Sample Ends here -->

          </div>
        </div>

        <div id="create-new-quick-add-overlay" style="width: 100%; height: 100%; position: absolute; top: 0; left: 0; background-color: #393939b3; display: none;">
          <div id="create-new-quick-add-container" style="z-index: 1000;" >
            <div>
              <button class="btn" onclick="toggleDisplay('create-new-quick-add-overlay', 'none')">Cancel</button>
              <h1>New Quick Add</h1>
              <button id="new-quick-add-spent-btn" class="btn" onclick="toggleExpenseType('spent')">Spent</button>
              <button id="new-quick-add-gained-btn" class="btn" onclick="toggleExpenseType('gained')">Gained</button>
              <input type="number" id="quick-add-amount-input" placeholder="Amount" />
              <input type="text" id="quick-add-title-input" placeholder="Title" />
              <button id="enter-btn" class="btn" onclick="createQuickAddEntry()">Enter</button>
            </div>
          </div>
        </div>

        

      </div>

        <!-- Bottom Navigation -->
        <button class="tablink" onclick="window.location.href='newgoals.html'">

        <button class="tablink" onclick="window.location.href='index.html'">
