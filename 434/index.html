<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prototype - Home</title>
    <link rel="stylesheet" href="css/styles.css">
  </head>

  <body onload = "updateRings();">
    <div class="device">
      <!-- Home Content with Progress Rings -->
      <div id="Home" class="tabcontent" style="display: block;">
        <h1>WealthFit</h1>
        <button class="achievements" id = "achievements" onclick = "openAch()">
          <img src="assets/star.png" class="icon" alt="star"/>
          <br />Achievements
        </button>
        
  

        <div class="bars" id="bars">
          <div class="bar"><div class="bar-fill" id="dailybar" style="background:#e6c11e"></div></div>
        </div>
        <div>
          <p class = "proglabel" id = "proglabel">You are 75% of the way to your goal of $1000!</p>
        </div>

        <div class="controls">
          <label>Progress <input type="number" min="0" max="100" value="75" id="input1">% </label>
          <button onclick="updateRings()">Update</button>
        </div>

        <div class="achievement-panel" id="achievementPanel">
          <div class="panel-header">
            Your Achievements
            <button class="close-btn" id="closePanel" onclick = "closeAch()">&times;</button>
          </div>

          <div class="achievement" id = "a_goal">
            <div>
              <div class="achievement-title">First Goal</div>
              <div class="achievement-desc">Set your first goal on WealthFit</div>
            </div>
          </div>

          <div class="achievement" id = "a_log">
            <div>
              <div class="achievement-title">First Log</div>
              <div class="achievement-desc">Log your first expense or income</div>
            </div>
          </div>

          <div class="achievement" id = "a_quick">
            <div>
              <div class="achievement-title">Expert Planner</div>
              <div class="achievement-desc">Set a Quick Add recurring income/expense</div>
            </div>
          </div>

          <div class="achievement" id = "a_7">
            <div>
              <div class="achievement-title">Dedicated</div>
              <div class="achievement-desc">Log an item 7 days in a row</div>
            </div>
          </div>
        </div>
        

      </div>

      <!-- Bottom Navigation -->
      <button class="tablink" onclick="window.location.href='newgoals.html'">
        <img src="assets/text_icon.png" class="icon" alt="goals"/>
        <br />Goals
      </button>
      <button class="tablink" onclick="window.location.href='log.html'">
        <img src="assets/lower_right_icon.png" class="icon" alt="log"/>
        <br />Log
      </button>
      <button class="tablink" style="background-color: grey;">
        <img src="assets/colors_icon.png" class="icon" alt="home" />
        <br />Home
      </button>
      <button class="tablink" onclick="window.location.href='stats.html'">
        <img src="assets/user.png" class="icon" alt="stats" />
        <br />Stats
      </button>
      <button class="tablink" onclick="window.location.href='settings.html'">
        <img src="assets/choices_icon.png" class="icon" alt="settings"/>
        <br />Settings
      </button>
    </div>

    <script src="js/main.js"></script>
  </body>
</html>
